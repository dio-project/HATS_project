[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hats-trading-system"
version = "0.1.0"
description = "Modular, paper-first hierarchical automated trading system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "httpx2>=2.0,<3.0", "ruff>=0.6,<1.0"]

[tool.setuptools]
package-dir = {"" = "apps/api"}
[tool.setuptools.packages.find]
where = ["apps/api"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py312"
